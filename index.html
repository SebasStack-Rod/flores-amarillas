<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>AMIGA</title>
    <style>
        .boton-grande {
            display: inline-block;
            margin-top: 30px;
            padding: 24px 60px;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            background: #ff4d88;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(255, 77, 136, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .boton-grande:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 28px rgba(255, 77, 136, 0.7);
        }

        .boton-grande:active {
            transform: scale(0.97);
        }

        .contenedor-boton {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="greetings">
        <span>A</span>
        <span>M</span>
        <span>I</span>
        <span>G</span>
        <span>A</span>
    </div>

    <div class="description">
        <span>Abajo te tengo un regalo</span>
    </div>

    <div class="contenedor-boton">
        <button type="button" class="boton-grande" id="botonRegalo">🎁 APRIETA AQUÍ</button>
    </div>

    <script>
        document.getElementById("botonRegalo").addEventListener("click", function () {
            window.location.href = "flower.html";
        });
    </script>
</body>

</html>
