<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
</head>

<body>
    <div class="greetings">
        <span>B</span>
        <span>e</span>
        <span>l</span>
        <span>u</span>
        <span>!</span>
    </div>
    <div class="description">
        <span>TE TENGO DOS REGALOS :)</span>
    </div>

    <div class="regalos">
        <button type="button" class="regalo" id="regalo1">REGALO 1</button>
        <a href="flower.html" class="regalo" id="regalo2">REGALO 2</a>
    </div>

    <p class="nota">Por el bien de la sorpresa, elegí el regalo 1 porque el segundo es para computadora.</p>

    <div class="mensaje" id="mensaje" hidden>
        <p>Salí afuera de tu casa y tu corazón.</p>
        <p class="mensaje__fin">Y listo.</p>
    </div>

    <script>
        document.getElementById("regalo1").addEventListener("click", function () {
            var mensaje = document.getElementById("mensaje");
            mensaje.hidden = false;
            mensaje.classList.remove("mensaje--visible");
            void mensaje.offsetWidth; // reinicia la animación si vuelve a tocar el botón
            mensaje.classList.add("mensaje--visible");
        });
    </script>
</body>

</html>
